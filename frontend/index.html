<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2b2b2b" />
    <meta
      name="description"
      content="Gestión de fábrica con un layout de áreas redimensionables estilo Blender."
    />
    <title>Gestión de Fábrica · Áreas estilo Blender</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="barra-superior">
      <div class="marca">
        <span class="logo">🟦</span>
        <span class="titulo-app">Gestión de Fábrica</span>
      </div>
      <nav
        class="configuraciones"
        id="configuraciones"
        aria-label="Configuraciones guardadas"
      ></nav>
      <nav class="workspaces" id="workspaces" aria-label="Workspaces"></nav>
      <div class="acciones">
        <button
          type="button"
          id="boton-enfocar"
          class="boton boton-primario"
          title="Ampliar el área enfocada (Ctrl+Espacio)"
          hidden
        >
          ⛶ Enfocar
        </button>
        <button
          type="button"
          id="boton-desenfocar"
          class="boton boton-peligro"
          title="Volver al layout anterior"
          hidden
        >
          ⤢ Desenfocar
        </button>
        <button type="button" id="boton-restablecer" class="boton">
          ↺ Restablecer layout
        </button>
        <button
          type="button"
          id="boton-tema"
          class="boton"
          title="Cambiar entre modo oscuro y modo claro"
        >
          ☀️
        </button>
      </div>
    </header>

    <main id="escenario" class="escenario"></main>

    <footer class="barra-estado">
      <span id="texto-estado"></span>
      <span class="pistas">
        Esquinas: arrastra hacia dentro para dividir · hacia fuera para unir ·
        arrastra los bordes para redimensionar
      </span>
    </footer>

    <div class="modal-fondo" id="modal-config" hidden>
      <div
        class="modal-caja"
        role="dialog"
        aria-modal="true"
        aria-labelledby="titulo-modal-config"
      >
        <h3 id="titulo-modal-config">Guardar configuración</h3>
        <p class="modal-descripcion">
          Ponle un nombre a la distribución actual de las áreas para poder
          volver a ella cuando quieras.
        </p>
        <input
          type="text"
          id="input-nombre-config"
          class="modal-input"
          placeholder="Nombre de la configuración"
          maxlength="40"
          autocomplete="off"
        />
        <div class="modal-botones">
          <button type="button" id="boton-cancelar-config" class="boton">
            Cancelar
          </button>
          <button
            type="button"
            id="boton-aceptar-config"
            class="boton boton-primario"
          >
            Guardar
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
